<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://rsnxhuhibglieofikkpo.supabase.co; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com;">
  <title>Redirecting to Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./css/output.css" rel="stylesheet">
  <script src="js/vendor/supabase.js"></script>
  <script type="module" src="supabase-public.js"></script>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎪</text></svg>">
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center py-10 px-4">
  <div class="max-w-lg w-full p-8 bg-white rounded-xl shadow-md border border-gray-200 text-center">

    <div id="loadingMsg">
      <svg class="animate-spin h-10 w-10 text-indigo-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
      </svg>
      <h2 class="text-lg font-bold text-gray-800">Taking you to secure payment…</h2>
      <p class="text-sm text-gray-500 mt-1">You'll be redirected in a moment.</p>
      <p class="text-sm text-gray-400 mt-4">Not redirected? <a id="manualLink" href="#"
          class="text-indigo-600 underline">Click here</a>.</p>
    </div>

    <div id="errorMsg" class="hidden p-5 bg-yellow-50 border border-yellow-200 rounded-lg">
      <svg class="w-10 h-10 text-yellow-500 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z">
        </path>
      </svg>
      <h3 class="text-lg font-bold text-yellow-800 mb-1">Payment Link Unavailable</h3>
      <p id="errorText" class="text-sm text-yellow-700">This link is invalid or has expired. Please check your email
        for the current payment link, or <a id="contact-link" href="#" class="text-yellow-800 underline">contact us
          directly</a>.</p>
    </div>

  </div>

  <script type="module" src="./js/page-pay.js"></script>
</body>

</html>
