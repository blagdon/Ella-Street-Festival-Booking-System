<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://vercel.live; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://rsnxhuhibglieofikkpo.supabase.co https://challenges.cloudflare.com https://vercel.live; frame-src https://challenges.cloudflare.com https://vercel.live; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com;">
  <title>Pay for Your Stall Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./css/output.css" rel="stylesheet">
  <script src="js/vendor/supabase.js"></script>
  <script type="module" src="supabase-public.js"></script>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎪</text></svg>">
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center py-10 px-4">
  <div class="max-w-lg w-full p-8 bg-white rounded-xl shadow-md border border-gray-200 text-center">

    <!-- Invalid / missing token state - no payment_link_code in the URL at
         all, so there is nothing a Turnstile solve or a retry could fix. -->
    <div id="invalidTokenMsg" class="hidden p-5 bg-yellow-50 border border-yellow-200 rounded-lg text-center">
      <svg class="w-10 h-10 text-yellow-500 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path>
      </svg>
      <h3 class="text-lg font-bold text-yellow-800 mb-1">Invalid Payment Link</h3>
      <p class="text-sm text-yellow-700">This link is missing a valid payment token. Please use the link from your
        payment request email or text, or <a id="contact-link" href="#" class="text-yellow-800 underline">contact us
          directly</a>.</p>
    </div>

    <!-- Main state (shown whenever a token is present). payFormControls
         (the CAPTCHA + button) stays visible through a RECOVERABLE failure
         (forgot the CAPTCHA, a momentary "still preparing" race) so it can
         just be retried - but is hidden on a TERMINAL one (already paid/
         cancelled, invalid token), where offering "Continue to Payment"
         next to a message saying there's nothing left to do would be
         actively misleading. Only success navigates away. -->
    <div id="payForm" class="hidden">
      <div id="payFormControls">
        <h2 class="text-lg font-bold text-gray-800 mb-1">Ready to pay your stall fee</h2>
        <p class="text-sm text-gray-500 mb-4">Please complete the check below to continue to secure payment.</p>

        <div class="cf-turnstile mx-auto mb-4 flex justify-center" data-sitekey="" data-theme="light"></div>

        <button type="button" id="continueBtn"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-sm flex justify-center items-center">
          <span id="continueBtnText">Continue to Payment</span>
        </button>
      </div>

      <div id="statusMessage" class="hidden mt-4 p-4 rounded-lg bg-yellow-50 border border-yellow-200 text-center text-sm text-yellow-800"></div>

      <p class="mt-4 text-xs text-gray-600 text-center">
        Trouble paying? <a id="contact-link-error" href="#" class="underline">Contact us</a>.
      </p>
    </div>

  </div>

  <script type="module" src="./js/page-pay.js"></script>
</body>

</html>
